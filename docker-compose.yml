services:
  db:
    image: postgres:17
    container_name: cineplus
    restart: unless-stopped

    environment:
      POSTGRES_DB: cineplus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - cineplus_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cineplus_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - cineplus_redis_data:/data

    command: ["redis-server", "--appendonly", "yes"]

volumes:
  cineplus_data:
  cineplus_redis_data: